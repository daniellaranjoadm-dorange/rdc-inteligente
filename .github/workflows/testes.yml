name: Testes (PostgreSQL)

# Roda a suíte inteira no mesmo banco da produção (PostgreSQL) a cada push.
# Pega erros que o SQLite local deixa passar (ex.: FOR UPDATE em join opcional).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rdc
          POSTGRES_PASSWORD: rdc
          POSTGRES_DB: rdc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rdc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rdc:rdc@localhost:5432/rdc
      DJANGO_SECRET_KEY: chave-somente-para-teste
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Checagens do Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py test --noinput --parallel 1
