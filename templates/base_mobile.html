{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}RDC Mobile{% endblock %} · D'OR@NGE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/dorange.css' %}" rel="stylesheet">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0e11">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RDC">
    <link rel="icon" href="{% static 'img/dorange-mark.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<header class="dg-mobile-header">
    <a class="dg-mobile-brand" href="/m/">
        <span class="dg-wordmark">D'OR<span class="at">@</span>NGE</span>
        <span class="dg-wordmark-tag">Modo campo</span>
    </a>
    {% if request.user.is_authenticated %}
    <div class="dg-mobile-user">
        <span class="user-avatar" title="{{ request.user.username }}">{{ request.user.username|slice:':1' }}</span>
        <form method="post" action="/accounts/logout/">{% csrf_token %}<button type="submit" class="btn-sair">Sair</button></form>
    </div>
    {% endif %}
</header>

<main class="dg-mobile-content">
    {% block content %}{% endblock %}
</main>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/static/sw.js")
                    .then(function (registration) {
                        console.log("[pwa] service worker registrado", registration.scope);
                    })
                    .catch(function (error) {
                        console.error("[pwa] falha ao registrar service worker", error);
                    });
            });
        }
    </script>
</body>
</html>
